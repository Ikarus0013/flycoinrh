name: fly-render-poc
# Zero-cost 3D fly render in the disposable GH-Actions sandbox.
# Free tools only: Blender (GPL) + ffmpeg. Mesh is CC-BY (see render/assets/CREDITS.md).
on:
  workflow_dispatch:
    inputs:
      model:    { description: "path to CC0/CC-BY mesh ('' = procedural)", default: "render/assets/fly_glowbox.glb" }
      frames:   { description: "frames in the hover loop", default: "48" }
      res:      { description: "square render px",          default: "720" }
      samples:  { description: "cycles samples",            default: "64" }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: System libs for headless Blender + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 \
            libxkbcommon0 libxext6 ffmpeg xz-utils

      - name: Fetch Blender (free, LTS tarball)
        run: |
          set -e
          BV=4.2.0
          URL="https://download.blender.org/release/Blender4.2/blender-${BV}-linux-x64.tar.xz"
          echo "downloading $URL"
          curl -fsSL "$URL" -o blender.tar.xz
          mkdir -p blender && tar -xf blender.tar.xz -C blender --strip-components=1
          ./blender/blender --version

      - name: Render the fly (Cycles CPU, transparent loop)
        run: |
          ./blender/blender -b -noaudio -P render/fly_scene.py -- \
            --model "${{ inputs.model }}" \
            --out render/out \
            --frames "${{ inputs.frames }}" \
            --res "${{ inputs.res }}" \
            --samples "${{ inputs.samples }}"
          ls -la render/out | head

      - name: Assemble preview loops (transparent webm + felt-backed mp4)
        run: |
          cd render/out
          # keep the alpha PNGs (uploaded) for the real composite over gameplay.
          # transparent VP9 webm — the compositing source.
          ffmpeg -y -framerate 24 -i fly_%04d.png -c:v libvpx-vp9 -pix_fmt yuva420p fly_loop.webm
          # felt-backed mp4 so the loop is viewable standalone.
          ffmpeg -y -framerate 24 -i fly_%04d.png \
            -f lavfi -i color=c=0x0b3d1a:s=${{ inputs.res }}x${{ inputs.res }} \
            -filter_complex "[1:v][0:v]overlay=shortest=1,format=yuv420p" \
            -movflags +faststart fly_loop.mp4
          ls -la

      - name: Bundle alpha PNGs for compositing
        run: |
          cd render/out
          tar -czf fly_frames_rgba.tar.gz fly_*.png
          ls -la fly_frames_rgba.tar.gz

      - name: Upload render proof + compositing source
        uses: actions/upload-artifact@v4
        with:
          name: fly-render-poc
          path: |
            render/out/fly_loop.mp4
            render/out/fly_loop.webm
            render/out/fly_frames_rgba.tar.gz
            render/out/fly_0001.png
            render/out/fly_0024.png
          if-no-files-found: error
